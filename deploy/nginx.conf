# ==============================================================================
# PΛND0RΛ / FORENX — production reference reverse proxy (nginx >= 1.25)
#
#   Internet ──443──▶ nginx ──▶ 127.0.0.1:3000 (Next.js standalone, loopback only)
#                          └──▶ S3 object storage (optional same-origin pass-through)
#
# Install: include this file from the http{} context, e.g.
#   /etc/nginx/conf.d/pandora.conf  (the http-level directives below are valid there)
# Placeholders to review before deploy:
#   pandora.whoiswho.at             — public host name
#   your-project-id.supabase.co     — Supabase project (connect-src)
#   hel1.your-objectstorage.com     — S3 endpoint (connect-src + pass-through)
# ==============================================================================

# ---- http-level hardening ----------------------------------------------------
server_tokens off;

# Request-size / timeout limits against slowloris-style abuse.
client_header_timeout 15s;
large_client_header_buffers 4 16k;

# Per-IP rate limits (API is stricter than pages).
limit_req_zone $binary_remote_addr zone=pandora_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pandora_web:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=pandora_conn:10m;

# WebSocket upgrade only when the client asks for it.
map $http_upgrade $pandora_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream pandora_app {
    # The Node process must listen on loopback only (ecosystem.config.cjs HOSTNAME=127.0.0.1).
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---- plain HTTP: ACME challenge + redirect only (no HSTS on HTTP) ------------
server {
    listen 80;
    listen [::]:80;
    server_name pandora.whoiswho.at;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- reject unknown Host headers ---------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/pandora.whoiswho.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pandora.whoiswho.at/privkey.pem;
    return 444;
}

# ---- HTTPS application -------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pandora.whoiswho.at;

    ssl_certificate     /etc/letsencrypt/live/pandora.whoiswho.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pandora.whoiswho.at/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pandora_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    limit_conn pandora_conn 50;

    # -------------------------------------------------------------------------
    # Security headers. `always` so they are also sent on 4xx/5xx.
    # INVARIANT: no location{} below uses add_header — nginx would otherwise drop
    # every header defined here for that location.
    # -------------------------------------------------------------------------
    # HSTS only here — the HTTPS production host. Add `preload` only after
    # submitting the domain to hstspreload.org.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\"), usb=(), serial=(), bluetooth=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # CSP: Next.js App Router emits inline bootstrap scripts; without a per-request
    # nonce (requires Next middleware) script-src must allow 'unsafe-inline'.
    # All other directives are strict. Extend connect-src deliberately, never with *.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; frame-src https://js.stripe.com https://hooks.stripe.com; connect-src 'self' https://your-project-id.supabase.co wss://your-project-id.supabase.co https://hel1.your-objectstorage.com https://api.stripe.com https://api.mistral.ai; upgrade-insecure-requests" always;

    # Global defaults: small, controlled buffers; streaming is enabled per location.
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $pandora_connection_upgrade;
    # Client-supplied identity headers are never trusted upstream.
    proxy_set_header X-Caller "";
    proxy_set_header X-User-Id "";
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # --- Immutable build assets -------------------------------------------
    # Next.js already sends `Cache-Control: public, max-age=31536000, immutable`.
    location ^~ /_next/static/ {
        proxy_pass http://pandora_app;
        access_log off;
    }

    # --- Large evidence uploads through the app (streamed, not buffered) ----
    # Target 250 MB; limit carries a small reserve for multipart overhead.
    location ~ ^/api/vault/?$ {
        limit_req zone=pandora_api burst=5 nodelay;
        client_max_body_size 260m;
        client_body_buffer_size 128k;     # small: the body is streamed, not held in RAM
        proxy_request_buffering off;      # forward bytes to Node as they arrive
        proxy_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_body_timeout 300s;
        proxy_pass http://pandora_app;
    }

    # --- Long-running AI calls (SSE) ------------------------------------------
    location ^~ /api/ai/ {
        limit_req zone=pandora_api burst=5 nodelay;
        client_max_body_size 2m;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://pandora_app;
    }

    # Plain prefix (not ^~) so the /api/vault regex above can still win.
    location /api/ {
        limit_req zone=pandora_api burst=20 nodelay;
        client_max_body_size 10m;
        proxy_pass http://pandora_app;
    }

    # --- Optional same-origin S3 pass-through for presigned PUT/GET ---------
    # The browser normally talks to S3 directly (connect-src above + bucket CORS).
    # If a same-origin path is preferred, rewrite the presigned URL origin to
    # https://pandora.whoiswho.at/vault-s3/ — the SigV4 signature stays valid
    # because the upstream Host and the canonical path (/bucket/key) are unchanged.
    location ^~ /vault-s3/ {
        limit_except GET PUT HEAD { deny all; }
        client_max_body_size 260m;
        client_body_buffer_size 128k;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_body_timeout 300s;

        proxy_ssl_server_name on;
        proxy_ssl_name hel1.your-objectstorage.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host hel1.your-objectstorage.com;
        # Presigned URLs carry their own signature: never forward app cookies,
        # bearer tokens or forwarding metadata to object storage.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_pass https://hel1.your-objectstorage.com/;
    }

    location / {
        limit_req zone=pandora_web burst=60 nodelay;
        proxy_pass http://pandora_app;
    }
}
