# ==============================================================================
# PΛND0RΛ FORENX OS — Apache Maintenance Mode Configuration
# File: /etc/apache2/sites-available/000-maintenance.conf
# Used during deployment windows & disaster recovery procedures
# ==============================================================================

<VirtualHost *:80>
    ServerName pandora.whoiswho.at
    DocumentRoot /var/www/html

    ErrorDocument 503 /maintenance.html
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !=/maintenance.html
    RewriteRule ^.*$ - [R=503,L]
    Header always set Retry-After "300"
</VirtualHost>

<VirtualHost *:443>
    ServerName pandora.whoiswho.at
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pandora.whoiswho.at/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pandora.whoiswho.at/privkey.pem

    ErrorDocument 503 /maintenance.html
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !=/maintenance.html
    RewriteRule ^.*$ - [R=503,L]
    Header always set Retry-After "300"
</VirtualHost>
