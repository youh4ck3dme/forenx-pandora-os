# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR PΛND0RΛ FORENX OS
# Doména: pandora.whoiswho.at
#
# Podporuje:
# - Neobmedzený SSE streaming pre Mistral AI (až 600s timeout bez odpájania)
# - Veľké forenzné súbory do 250 MB
# - WebSockets / HMR pre real-time komunikáciu
# ==============================================================================

upstream pandora_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name pandora.whoiswho.at;
    
    # Presmerovanie na HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pandora.whoiswho.at;

    # SSL Certifikáty (Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/pandora.whoiswho.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pandora.whoiswho.at/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Maximálna veľkosť uploadu (pre forenzné balíky a CSV výpisy)
    client_max_body_size 250M;

    # Bezpečnostné hlavičky
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Statické assety (Next.js cache)
    location /_next/static/ {
        proxy_pass http://pandora_backend;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # Hlavná proxy lokácia pre celú aplikáciu a dlhotrvajúce AI streaming volania
    location / {
        proxy_pass http://pandora_backend;
        proxy_http_version 1.1;

        # WebSocket a Connection hlavičky
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ======================================================================
        # KRITICKÉ NASTAVENIE PRE MISTRAL AI (500s STREAMING BEZ VERCEL LIMITU)
        # ======================================================================
        proxy_read_timeout 600s;       # 10 minút na dlhé AI generovanie
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        # Vypnutie proxy bufferovania — nevyhnutné pre plynulý SSE streaming odpovedí
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering "no";
    }
}
