# ==============================================================================
# PΛND0RΛ FORENX OS — Canonical Apache 2.4 Reverse Proxy Configuration
# File: /etc/apache2/sites-available/pandora.conf (or /etc/httpd/conf.d/pandora.conf)
# Target: Production VPS (Ports 80/443 -> Loopback :3005)
# Invariant: Loopback trust, anti-spoofing X-Real-IP override, long AI streaming
# ==============================================================================

<VirtualHost *:80>
    ServerName pandora.whoiswho.at
    ServerAdmin admin@whoiswho.at

    # Redirect all plain HTTP traffic to secure HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/pandora_error.log
    CustomLog ${APACHE_LOG_DIR}/pandora_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName pandora.whoiswho.at
    ServerAdmin admin@whoiswho.at

    # TLS / SSL Configuration (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pandora.whoiswho.at/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pandora.whoiswho.at/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Security Headers (Enforced at Edge Proxy)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"

    # Anti-Spoofing & Trusted Proxy Headers (P6 Invariant)
    # Overwrites client-supplied X-Real-IP with actual peer TCP connection address
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Proxy Pass Configuration
    ProxyPreserveHost On
    ProxyAddHeaders On

    # AI and Forensic File Analysis Timeouts (600s execution budget)
    ProxyTimeout 600
    Timeout 600

    # WebSocket & SSE Streaming Support for Realtime Telemetry
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://127.0.0.1:3005/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*)           http://127.0.0.1:3005/$1 [P,L]

    ProxyPassReverse / http://127.0.0.1:3005/

    # Forensic Evidence Large Upload Limit (250 MB max)
    LimitRequestBody 262144000

    ErrorLog ${APACHE_LOG_DIR}/pandora_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/pandora_ssl_access.log combined
</VirtualHost>
