name: Production verification

on:
  # Každý PR sa testuje na merge refe s main (strict status checks), preto push
  # beží iba na main. Bez paths-ignore na pull_request: povinný check by pri
  # PR len s dokumentáciou ostal navždy „expected“ a zablokoval merge.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Nový push do toho istého PR/vetvy zruší ešte bežiaci starší beh.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm ci fails if package.json and package-lock.json disagree.
      - run: npm ci
      # Full tree, not --omit=dev: this repo lists runtime packages such as
      # `next` under devDependencies, so a prod-only audit would miss them.
      # Critical is a hard gate now; raise to "high" once the electron major
      # upgrade (tracked separately) lands.
      - run: npm audit --audit-level=critical
      - run: npm run verify:production
      # Deterministic release ZIP from tracked files; fails if a tracked
      # env/key/DB file would be packaged.
      - run: node scripts/release/package.mjs HEAD dist/release

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        # Pinned CLI via container: no license/token needed, fails the job on any finding.
        # Reviewed false positives are listed by exact fingerprint in .gitleaksignore.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --redact --verbose --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 1 .
      - name: Upload gitleaks report (redacted)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7

  docker-build:
    name: Build & publish container image (GHCR)
    needs: [verify, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push by digest
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.production
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

