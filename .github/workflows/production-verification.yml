name: Production verification

on:
  push:
  pull_request:
  merge_group:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify:production

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        # Pinned CLI via container: no license/token needed, fails the job on any finding.
        # Reviewed false positives are listed by exact fingerprint in .gitleaksignore.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --redact --verbose --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 1 .
      - name: Upload gitleaks report (redacted)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7

  supply-chain:
    name: Lockfile, dependency audit, release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci fails if package.json and package-lock.json disagree.
      - run: npm ci --ignore-scripts
      # Full tree, not --omit=dev: this repo lists runtime packages such as
      # `next` under devDependencies, so a prod-only audit would miss them.
      # Critical is a hard gate now; raise to "high" once the electron major
      # upgrade (tracked separately) lands.
      - run: npm audit --audit-level=critical
      - run: node scripts/release/package.mjs HEAD dist/release
