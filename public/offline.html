<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PΛND0RΛ Browser - Offline Mode</title>
    <style>
      :root {
        --primary: #9333ea;
        --background: #000000;
        --text: #ffffff;
        --accent: #06b6d4;
      }
      body {
        margin: 0;
        padding: 0;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: var(--background);
        background-image: radial-gradient(
          circle at 50% 50%,
          rgba(147, 51, 234, 0.1) 0%,
          transparent 50%
        );
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        overflow: hidden;
      }
      .brand {
        font-size: 2.5rem;
        font-weight: 900;
        letter-spacing: -0.05em;
        margin-bottom: 0.5rem;
        background: linear-gradient(
          to bottom right,
          var(--text),
          var(--accent)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .status {
        font-family: monospace;
        font-size: 0.8rem;
        letter-spacing: 0.3em;
        color: var(--primary);
        margin-bottom: 2rem;
        text-transform: uppercase;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }
      p {
        color: rgba(255, 255, 255, 0.6);
        max-width: 300px;
        line-height: 1.6;
        font-size: 0.9rem;
      }
      .btn {
        margin-top: 2.5rem;
        padding: 0.8rem 2rem;
        background: linear-gradient(to right, var(--primary), var(--accent));
        color: white;
        text-decoration: none;
        border-radius: 99px;
        font-weight: bold;
        font-size: 0.9rem;
        transition:
          transform 0.2s,
          opacity 0.2s;
        box-shadow: 0 10px 20px -10px var(--primary);
      }
      .btn:hover {
        transform: translateY(-2px);
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="brand">PΛND0RΛ</div>
    <div class="status">Offline Mode</div>
    <h1>Nie ste pripojený k sieti</h1>
    <p>Skontrolujte svoje pripojenie a skúsime to znova spolu.</p>
    <a href="/" class="btn">Znovu pripojiť</a>
  </body>
</html>
